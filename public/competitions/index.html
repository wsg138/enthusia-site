<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Browse current, upcoming, and completed Enthusia competitions.">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Competitions | Enthusia</title>
  <link rel="stylesheet" href="../assets/styles.css?v=vision65">
  <link rel="stylesheet" href="../assets/competitions.css?v=3">
  <link rel="stylesheet" href="../assets/competitions-appearance.css?v=1">
</head>
<body class="competitions-page" data-competition-page="catalog">
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="../index.html"><img class="brand-logo" src="../assets/enthusia-logo-v2.png" alt="" width="46" height="46"><span class="brand-name">Enthusia SMP</span></a>
      <nav class="nav" aria-label="Competition navigation">
        <a href="../index.html">Home</a>
        <a href="../rules.html">Rules</a>
        <a href="../gallery.html">Gallery</a>
        <span class="site-account" data-site-account></span>
      </nav>
    </div>
  </header>

  <main class="page-main container competitions-main">
    <section class="competitions-intro">
      <div>
        <p class="competitions-kicker">Enthusia Community</p>
        <h1>Competitions</h1>
        <p>Enter on your own or with your guild, follow every round, and come back when the results are in.</p>
      </div>
    </section>

    <section aria-labelledby="featured-title">
      <div class="competition-section-heading competition-section-heading-simple">
        <div>
          <p class="competitions-kicker">Now</p>
          <h2 id="featured-title">Current competition</h2>
        </div>
      </div>
      <div id="featuredCompetition" class="competition-loading">Loading competition…</div>
    </section>

    <section class="competition-section" aria-labelledby="upcoming-title">
      <div class="competition-section-heading competition-section-heading-simple">
        <div>
          <p class="competitions-kicker">Next</p>
          <h2 id="upcoming-title">Upcoming</h2>
        </div>
      </div>
      <div id="upcomingCompetitions" class="competition-grid"></div>
    </section>

    <section class="competition-section" aria-labelledby="history-title">
      <div class="competition-section-heading competition-section-heading-simple">
        <div>
          <p class="competitions-kicker">Archive</p>
          <h2 id="history-title">Completed competitions</h2>
        </div>
      </div>
      <div id="competitionHistory" class="competition-grid"></div>
    </section>
  </main>

  <script src="../assets/competitions.js?v=1" type="module"></script>
  <script src="../assets/site-account.js?v=1" type="module"></script>
  <script src="../assets/competitions-appearance.js?v=1" type="module"></script>
</body>
</html>
