<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Ask Enthusia staff to review an eligible punishment on your linked Minecraft account.">
  <title>Appeal a punishment | Enthusia</title>
  <link rel="icon" href="assets/enthusia-logo-v2.png" type="image/png">
  <link rel="stylesheet" href="assets/styles.css?v=vision69">
</head>
<body class="appeal-page">
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="index.html" aria-label="Enthusia SMP home"><img class="brand-logo" src="assets/enthusia-logo-v2.png" alt="" width="46" height="46"><span class="brand-name">Enthusia SMP</span></a>
      <nav class="nav" aria-label="Primary navigation"><a href="index.html">Home</a><a href="rules.html">Rules</a><a href="market.html">Market</a><a href="competitions/">Competitions</a><span class="site-account" data-site-account></span></nav>
    </div>
  </header>
  <main class="page-main container appeal-main">
    <section class="appeal-intro">
      <p class="eyebrow">Account support</p>
      <h1>Appeal a punishment</h1>
      <p>Choose an eligible punishment from your linked Minecraft account and tell staff what they should review.</p>
    </section>
    <form id="appeal-form" class="appeal-form card">
      <label class="appeal-field">Punishment<select name="punishmentId" id="punishment" required><option value="">Loading your punishments…</option></select></label>
      <section id="sanction" class="appeal-sanction" aria-live="polite" hidden></section>
      <label class="appeal-field">What should staff reconsider?<textarea name="reason" minlength="10" maxlength="1000" rows="8" required placeholder="Explain what happened and why you are asking for another review."></textarea></label>
      <div class="appeal-submit-row"><button class="btn" type="submit">Send appeal</button><p id="result" role="status"></p></div>
    </form>
  </main>
  <script type="module" src="assets/site-account.js?v=3"></script>
  <script type="module">
    const form=document.querySelector('#appeal-form');const result=document.querySelector('#result');const select=document.querySelector('#punishment');const sanction=document.querySelector('#sanction');let sanctions=[];
    function render(){const item=sanctions.find(x=>String(x.id)===select.value);sanction.hidden=!item;sanction.textContent=item?`${item.type??'Punishment'} · issued ${item.createdAt??'date unavailable'} · ${item.reason??'No public reason provided'}`:'';}
    function loadError(status){sanctions=[];select.innerHTML=`<option value="">${status===401?'Sign in and link your Minecraft account to continue':'Unable to load punishments — try again later'}</option>`;sanction.hidden=true;}
    async function load(){select.innerHTML='<option value="">Loading your punishments…</option>';try{const response=await fetch('/api/appeals/eligible');if(!response.ok){loadError(response.status);return;}const payload=await response.json();sanctions=Array.isArray(payload)?payload:payload.punishments??[];select.replaceChildren(new Option(sanctions.length?'Choose a punishment':'No punishments are currently eligible',''));for(const item of sanctions)select.add(new Option(`${item.type??'Punishment'} — ${item.createdAt??item.id}`,item.id));render();}catch{loadError();}}
    select.addEventListener('change',render);form.addEventListener('submit',async(event)=>{event.preventDefault();result.textContent='Sending…';const data=Object.fromEntries(new FormData(form));try{const response=await fetch('/api/appeals',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(data)});const payload=await response.json().catch(()=>({}));result.textContent=response.ok?'Appeal sent to staff.':payload.error==='rate_limited'?`Too many attempts. Try again in ${payload.retryAfter} seconds.`:response.status===401?'Sign in and link your Minecraft account first.':`Unable to send the appeal (${response.status}).`;if(response.ok){form.reset();await load();}}catch{result.textContent='Unable to reach the appeal service. Try again in a moment.';}});load();
  </script>
</body>
</html>
