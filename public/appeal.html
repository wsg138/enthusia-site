<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Appeal a punishment | Enthusia</title><link rel="stylesheet" href="/assets/css/styles.css"></head>
<body><main class="container"><h1>Appeal a punishment</h1><p>Your linked Minecraft identity is supplied by your signed-in account and cannot be changed here.</p><form id="appeal-form"><label>Punishment ID <input name="punishmentId" maxlength="128" required></label><label>Why should this punishment be reviewed? <textarea name="reason" maxlength="4000" required></textarea></label><button type="submit">Submit appeal</button><p id="result" role="status"></p></form></main><script type="module">
const form=document.querySelector('#appeal-form');const result=document.querySelector('#result');form.addEventListener('submit',async(event)=>{event.preventDefault();result.textContent='Submitting…';const data=Object.fromEntries(new FormData(form));const response=await fetch('/api/appeals',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(data)});result.textContent=response.ok?'Appeal submitted.':`Unable to submit appeal (${response.status}).`;if(response.ok)form.reset();});
</script></body></html>
