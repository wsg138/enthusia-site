<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Appeal a punishment | Enthusia</title><link rel="stylesheet" href="/assets/css/styles.css"></head>
<body><main class="container"><h1>Appeal a punishment</h1><p>Your linked Minecraft identity is supplied by your signed-in account and cannot be changed here.</p><form id="appeal-form"><label>Punishment <select name="punishmentId" id="punishment" required><option value="">Loading appealable punishments…</option></select></label><section id="sanction" aria-live="polite"></section><label>Why should this punishment be reviewed? <textarea name="reason" maxlength="4000" required></textarea></label><button type="submit">Submit appeal</button><p id="result" role="status"></p></form></main><script type="module">
const form=document.querySelector('#appeal-form');const result=document.querySelector('#result');const select=document.querySelector('#punishment');const sanction=document.querySelector('#sanction');let sanctions=[];function render(){const item=sanctions.find(x=>String(x.id)===select.value);sanction.textContent=item?`${item.type??'Punishment'} · issued ${item.createdAt??'unknown date'} · ${item.reason??'No public reason provided'}`:'';}async function load(){const response=await fetch('/api/appeals/eligible');if(!response.ok){select.innerHTML='<option value="">Unable to load punishments</option>';return;}const payload=await response.json();sanctions=Array.isArray(payload)?payload:payload.punishments??[];select.replaceChildren(new Option(sanctions.length?'Select a punishment':'No appealable punishments',''));for(const item of sanctions)select.add(new Option(`${item.type??'Punishment'} — ${item.createdAt??item.id}`,item.id));render();}select.addEventListener('change',render);form.addEventListener('submit',async(event)=>{event.preventDefault();result.textContent='Submitting…';const data=Object.fromEntries(new FormData(form));const response=await fetch('/api/appeals',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(data)});const payload=await response.json().catch(()=>({}));result.textContent=response.ok?'Appeal submitted.':payload.error==='rate_limited'?`Too many attempts. Try again in ${payload.retryAfter} seconds.`:`Unable to submit appeal (${response.status}).`;if(response.ok){form.reset();await load();}});load();
</script></body></html>
