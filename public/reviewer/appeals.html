<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Appeal review | Enthusia Staff</title><link rel="stylesheet" href="../assets/styles.css?v=vision63"></head>
<body><main class="container"><h1>Appeal review</h1><p>Only authorized staff can access this page. Decisions use the appeal version shown when loaded; stale updates are rejected and must be refreshed.</p><label>Status <select id="status"><option value="OPEN">Open</option><option value="INFORMATION_REQUESTED">Waiting for player</option><option value="APPROVAL_PENDING">Approval pending</option><option value="APPLIED">Approved</option><option value="DENIED">Denied</option><option value="REJECTED">Approval failed</option><option value="ALL">All</option></select></label><button id="refresh">Refresh</button><div id="appeals" aria-live="polite"></div></main><script type="module">
const root=document.querySelector('#appeals');const status=document.querySelector('#status');const key=()=>crypto.randomUUID();async function decide(appeal,decision,note,result){if(note.trim().length<3){result.textContent='Enter a decision note.';return;}result.textContent='Saving…';try{const response=await fetch(`/api/reviewer/appeals/${encodeURIComponent(appeal.id)}`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({decision,note,expectedVersion:appeal.version,idempotencyKey:key()})});if(response.status===409){result.textContent='This appeal changed. Refresh before deciding.';return;}result.textContent=response.ok?'Decision saved.':`Unable to save (${response.status}).`;if(response.ok)await load();}catch{result.textContent='Unable to reach the appeal service. Retry in a moment.';}}function card(appeal){const article=document.createElement('article');const heading=document.createElement('h2');heading.textContent=`Appeal ${appeal.id??''}`;const meta=document.createElement('p');meta.textContent=`${appeal.player??'Unknown player'} · ${appeal.status??'unknown'} · version ${appeal.version??0}`;const punishment=document.createElement('p');punishment.textContent=`${appeal.punishmentType??'Punishment'} ${appeal.punishmentId??'unknown'} · case ${appeal.caseId??'unknown'}`;const reason=document.createElement('p');reason.textContent=appeal.reason??'';article.append(heading,meta,punishment,reason);if(appeal.decisionNote){const prior=document.createElement('p');prior.textContent=`Latest decision note: ${appeal.decisionNote}`;article.append(prior);}if(appeal.status==='OPEN'){const note=document.createElement('textarea');note.minLength=3;note.maxLength=1000;note.placeholder='Decision reason';const result=document.createElement('p');result.setAttribute('role','status');for(const [label,value] of [['Approve','approve'],['Deny','deny'],['Request information','request_information']]){const button=document.createElement('button');button.textContent=label;button.addEventListener('click',()=>decide(appeal,value,note.value,result));article.append(button);}article.append(note,result);}return article;}async function load(){root.textContent='Loading…';try{const response=await fetch(`/api/reviewer/appeals?status=${encodeURIComponent(status.value)}`);if(!response.ok){root.textContent=`Unable to load appeals (${response.status}).`;return;}const payload=await response.json();const appeals=Array.isArray(payload)?payload:payload.appeals??[];root.replaceChildren(...appeals.map(card));if(!appeals.length)root.textContent='No appeals found.';}catch{root.textContent='Unable to reach the appeal service. Use Refresh to retry.';}}document.querySelector('#refresh').addEventListener('click',load);status.addEventListener('change',load);load();
</script></body></html>
