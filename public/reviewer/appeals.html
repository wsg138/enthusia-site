<!doctype html>
<html lang="en" id="top">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Private Enthusia staff workspace for reviewing punishment appeals.">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="theme-color" content="#100d0a">
  <title>Appeal review | Enthusia Staff</title>
  <link rel="icon" href="../assets/enthusia-logo-v2.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;650;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/styles.css?v=vision86">
</head>
<body class="appeal-review-page moderation-page">
<a class="skip-link" href="#main-content">Skip to appeals</a>
<div class="bg" aria-hidden="true"><div class="bg-grid"></div><div class="bg-vignette"></div><div class="bg-heat"></div></div>

<header class="site-header review-site-header">
  <div class="container header-inner">
    <a class="brand" href="../index.html" aria-label="Enthusia SMP home"><img class="brand-logo" src="../assets/enthusia-logo-v2.png" alt="" width="46" height="46"><span class="brand-name">Enthusia SMP</span></a>
    <div class="review-header-actions"><a href="./">Staff dashboard</a><a href="../appeal.html">View appeal page</a></div>
  </div>
</header>

<main id="main-content" class="page-main reviewer-main">
  <section class="container reviewer-hero" aria-labelledby="reviewer-title">
    <div><p class="eyebrow">Staff workspace</p><h1 id="reviewer-title">Appeal reviews</h1><p>Open a case, read the appeal and conversation, then record the outcome.</p></div>
  </section>

  <section class="container reviewer-workspace" aria-label="Appeal queue">
    <div class="card reviewer-toolbar">
      <label for="status"><span>Show appeals</span><select id="status"><option value="OPEN">Open</option><option value="INFORMATION_REQUESTED">Waiting for player</option><option value="APPROVAL_PENDING">Approval pending</option><option value="APPLIED">Approved</option><option value="DENIED">Denied</option><option value="REJECTED">Approval failed</option><option value="ALL">All</option></select></label>
      <label for="review-search"><span>Find in this list</span><input id="review-search" type="search" maxlength="80" autocomplete="off" placeholder="Player, case, or appeal ID"></label>
      <button id="refresh" class="btn ghost" type="button">Refresh</button>
      <p id="reviewer-status" role="status">Loading appeals…</p>
    </div>
    <div id="appeals" class="reviewer-appeals" aria-live="polite" aria-busy="true"></div>
  </section>
</main>

<footer class="site-footer"><div class="container footer-inner"><p>&copy; <span id="year"></span> Enthusia SMP</p><p>Authorized staff access only</p></div></footer>
<script src="../assets/script.js?v=vision70" defer></script>
<script type="module" src="../assets/reviewer-appeals.js?v=3"></script>
</body>
</html>
