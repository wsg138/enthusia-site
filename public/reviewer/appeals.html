<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Appeal review | Enthusia Staff</title><link rel="stylesheet" href="/assets/css/styles.css"></head>
<body><main class="container"><h1>Appeal review</h1><p>Only authorized staff can access this page.</p><label>Status <select id="status"><option value="open">Open</option><option value="resolved">Resolved</option><option value="all">All</option></select></label><button id="refresh">Refresh</button><div id="appeals" aria-live="polite"></div></main><script type="module">
const root=document.querySelector('#appeals');const status=document.querySelector('#status');async function load(){root.textContent='Loading…';const response=await fetch(`/api/reviewer/appeals?status=${encodeURIComponent(status.value)}`);if(!response.ok){root.textContent=`Unable to load appeals (${response.status}).`;return;}const payload=await response.json();const appeals=Array.isArray(payload)?payload:payload.appeals??[];root.replaceChildren(...appeals.map((appeal)=>{const article=document.createElement('article');const heading=document.createElement('h2');heading.textContent=`Appeal ${appeal.id??''}`;const meta=document.createElement('p');meta.textContent=`${appeal.playerName??'Unknown player'} · ${appeal.status??'unknown'}`;const reason=document.createElement('p');reason.textContent=appeal.reason??'';article.append(heading,meta,reason);return article;}));if(!appeals.length)root.textContent='No appeals found.';}document.querySelector('#refresh').addEventListener('click',load);status.addEventListener('change',load);load();
</script></body></html>
