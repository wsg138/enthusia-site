name: Publish native mobile wiki sidebar

on:
  pull_request:
    branches: [main]
    paths:
      - 'wiki-native-mobile-sidebar-trigger.txt'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: enthusia-wiki-native-mobile-sidebar
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WIKI_API: https://enthusia.miraheze.org/w/api.php
      WIKI_NATIVE_MENU_OUT: wiki-native-mobile-sidebar-output
      WIKI_FULL_BACKUP_OUT: wiki-native-mobile-sidebar-output/full-backup
      WIKI_BOT_USERNAME: ${{ secrets.WIKI_BOT_USERNAME || secrets.MIRAHEZE_BOT_USERNAME || secrets.WIKI_USERNAME }}
      WIKI_BOT_PASSWORD: ${{ secrets.WIKI_BOT_PASSWORD || secrets.MIRAHEZE_BOT_PASSWORD || secrets.WIKI_PASSWORD }}

    steps:
      - name: Check out proposed source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate single-native-menu source
        shell: bash
        run: |
          set -euo pipefail
          node --check wiki-worker/mobile-corrections.js
          node --check wiki-worker/mobile-minerva-integration.js
          python3 -m py_compile wiki-worker/publish-native-mobile-sidebar.py
          test -s wiki-worker/mobile-native-sidebar.css
          test -s wiki-worker/public-sidebar.wiki
          grep -q 'NATIVE_MENU_CONTROL_SELECTOR' wiki-worker/mobile-corrections.js
          grep -q 'bindBottomMenuToNativeSidebar' wiki-worker/mobile-corrections.js
          grep -q 'removeLegacyCustomDrawer' wiki-worker/mobile-corrections.js
          grep -q 'enthusia-native-sidebar' wiki-worker/mobile-native-sidebar.css
          ! grep -q 'NAV_GROUPS' wiki-worker/mobile-corrections.js
          ! grep -q 'makeNativeMenuSections' wiki-worker/mobile-corrections.js
          ! grep -q 'openEnthusiaDrawer' wiki-worker/mobile-minerva-integration.js
          ! grep -q 'stopImmediatePropagation' wiki-worker/mobile-minerva-integration.js

      - name: Capture complete live wiki before edit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p wiki-native-mobile-sidebar-output
          python3 wiki-worker/full_backup.py | tee wiki-native-mobile-sidebar-output/full-backup.log
          test -s wiki-native-mobile-sidebar-output/full-backup/manifest.json
          pages="$(find wiki-native-mobile-sidebar-output/full-backup/pages -type f -name '*.wiki' | wc -l | tr -d ' ')"
          histories="$(find wiki-native-mobile-sidebar-output/full-backup/history -type f -name '*.json' | wc -l | tr -d ' ')"
          echo "full_backup_pages=$pages histories=$histories"
          test "$pages" -gt 0
          test "$histories" -eq "$pages"

      - name: Upload immutable pre-edit backup
        uses: actions/upload-artifact@v4
        with:
          name: enthusia-wiki-native-mobile-sidebar-backup-${{ github.run_id }}
          path: wiki-native-mobile-sidebar-output/
          if-no-files-found: error
          retention-days: 90

      - name: Require wiki credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$WIKI_BOT_USERNAME"
          test -n "$WIKI_BOT_PASSWORD"

      - name: Publish native mobile sidebar integration
        shell: bash
        run: |
          set -euo pipefail
          python3 wiki-worker/publish-native-mobile-sidebar.py | tee wiki-native-mobile-sidebar-output/publish.log

      - name: Upload publication evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: enthusia-wiki-native-mobile-sidebar-evidence-${{ github.run_id }}
          path: wiki-native-mobile-sidebar-output/
          if-no-files-found: warn
          retention-days: 90
