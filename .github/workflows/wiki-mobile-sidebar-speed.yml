name: Publish mobile sidebar speed fix

on:
  pull_request:
    branches: [main]
    paths:
      - 'wiki-worker/mobile-native-sidebar.css'
      - 'wiki-worker/publish-mobile-sidebar-speed.py'
      - 'wiki-worker/validate-live-mobile-sidebar-speed.mjs'
      - 'wiki-mobile-sidebar-speed-trigger.txt'
      - '.github/workflows/wiki-mobile-sidebar-speed.yml'

permissions:
  contents: read

jobs:
  publish-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      WIKI_API: https://enthusia.miraheze.org/w/api.php
      WIKI_SPEED_OUT: wiki-speed-output
      WIKI_FULL_BACKUP_OUT: wiki-speed-output/full-backup
      WIKI_BOT_USERNAME: ${{ secrets.WIKI_BOT_USERNAME }}
      WIKI_BOT_PASSWORD: ${{ secrets.WIKI_BOT_PASSWORD }}
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Validate speed-fix sources
        shell: bash
        run: |
          set -euo pipefail
          node --check wiki-worker/validate-live-mobile-sidebar-speed.mjs
          python3 -m py_compile wiki-worker/publish-mobile-sidebar-speed.py
          grep -q 'transition: transform .1s ease-out !important;' wiki-worker/mobile-native-sidebar.css
          grep -q 'transition: opacity .08s ease-out !important;' wiki-worker/mobile-native-sidebar.css
          ! grep -q 'visibility .18s' wiki-worker/mobile-native-sidebar.css
          ! grep -q 'visibility .15s' wiki-worker/mobile-native-sidebar.css

      - name: Capture complete live wiki before edit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$WIKI_SPEED_OUT"
          python3 wiki-worker/full_backup.py | tee "$WIKI_SPEED_OUT/full-backup.log"
          test -s "$WIKI_FULL_BACKUP_OUT/manifest.json"
          pages="$(find "$WIKI_FULL_BACKUP_OUT/pages" -type f -name '*.wiki' | wc -l | tr -d ' ')"
          histories="$(find "$WIKI_FULL_BACKUP_OUT/history" -type f -name '*.json' | wc -l | tr -d ' ')"
          echo "full_backup_pages=$pages histories=$histories"
          test "$pages" -gt 0
          test "$histories" -eq "$pages"

      - name: Upload immutable pre-edit backup
        uses: actions/upload-artifact@v4
        with:
          name: enthusia-wiki-sidebar-speed-backup-${{ github.run_id }}
          path: wiki-speed-output/
          if-no-files-found: error
          retention-days: 90

      - name: Require wiki credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$WIKI_BOT_USERNAME"
          test -n "$WIKI_BOT_PASSWORD"

      - name: Publish speed fix
        shell: bash
        run: |
          set -euo pipefail
          python3 wiki-worker/publish-mobile-sidebar-speed.py | tee "$WIKI_SPEED_OUT/publish.log"

      - name: Install browser timing harness
        shell: bash
        run: |
          set -euo pipefail
          command -v google-chrome || command -v google-chrome-stable || command -v chromium
          npm install --no-save --ignore-scripts puppeteer-core@24.16.0

      - name: Acceptance-test mobile open and close latency
        shell: bash
        run: |
          set -euo pipefail
          node wiki-worker/validate-live-mobile-sidebar-speed.mjs | tee "$WIKI_SPEED_OUT/browser-speed.log"

      - name: Upload publication and timing evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: enthusia-wiki-sidebar-speed-evidence-${{ github.run_id }}
          path: wiki-speed-output/
          if-no-files-found: warn
          retention-days: 90
