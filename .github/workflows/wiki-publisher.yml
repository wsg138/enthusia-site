name: Publish Enthusia wiki

on:
  pull_request:
    branches: [main]
    paths:
      - 'wiki-publish-trigger.txt'
      - 'public/wiki-demo/**'
      - 'wiki-worker/**'
      - '.github/workflows/wiki-publisher.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: enthusia-wiki-publisher
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WIKI_API: https://enthusia.miraheze.org/w/api.php
      WIKI_WORKER_OUT: wiki-worker-output
      WIKI_FULL_BACKUP_OUT: wiki-worker-output/full-backup
      WIKI_BOT_USERNAME: ${{ secrets.WIKI_BOT_USERNAME || secrets.MIRAHEZE_BOT_USERNAME || secrets.WIKI_USERNAME }}
      WIKI_BOT_PASSWORD: ${{ secrets.WIKI_BOT_PASSWORD || secrets.MIRAHEZE_BOT_PASSWORD || secrets.WIKI_PASSWORD }}

    steps:
      - name: Check out proposed wiki source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Confirm final preview source is present
        shell: bash
        run: |
          set -euo pipefail
          test -s public/wiki-demo/v2-core.js
          test -s public/wiki-demo/v2-support.js
          test -s public/wiki-demo/v2-commands.js
          test -s public/wiki-demo/v2-detail.js
          test -s public/wiki-demo/v2-reputation.js

      - name: Capture complete live wiki before publication
        shell: bash
        run: |
          set -euo pipefail
          python3 wiki-worker/full_backup.py | tee full-backup.log
          test -s wiki-worker-output/full-backup/manifest.json
          test -s wiki-worker-output/full-backup/comparison-to-old-baseline.json
          test -d wiki-worker-output/full-backup/pages
          test -d wiki-worker-output/full-backup/history
          pages="$(find wiki-worker-output/full-backup/pages -type f -name '*.wiki' | wc -l | tr -d ' ')"
          histories="$(find wiki-worker-output/full-backup/history -type f -name '*.json' | wc -l | tr -d ' ')"
          echo "full_backup_pages=$pages histories=$histories"
          test "$pages" -gt 0
          test "$histories" -eq "$pages"

      - name: Upload immutable full pre-publish backup
        uses: actions/upload-artifact@v4
        with:
          name: enthusia-wiki-full-pre-publish-backup-${{ github.run_id }}
          path: |
            full-backup.log
            wiki-worker-output/full-backup/
          if-no-files-found: error
          retention-days: 90

      - name: Render MediaWiki pages from approved v2 demo
        shell: bash
        run: |
          set -euo pipefail
          node --check wiki-worker/render_pages.mjs
          node wiki-worker/render_pages.mjs
          test -s wiki-worker-output/rendered/manifest.json

      - name: Player-facing content guardrails
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R -E -i '(/casino|/spin|/arm)([^a-z]|$)' wiki-worker-output/rendered
          ! grep -R -E -i 'velocity\.hub|/gmc([^a-z]|$)' wiki-worker-output/rendered
          ! grep -R -E -i '\+1% movement speed|\+3% movement speed|\+5% movement speed|-1% movement speed|-3% movement speed|-5% movement speed|-10% movement speed' wiki-worker-output/rendered
          grep -R -q 'PieCloak' wiki-worker-output/rendered
          grep -R -q 'outside Spawn and the Warzone' wiki-worker-output/rendered || grep -R -q 'Outside Spawn and the Warzone' wiki-worker-output/rendered

      - name: Validate rendered pages with Miraheze parser
        shell: bash
        run: |
          set -euo pipefail
          python3 wiki-worker/validate_rendered.py | tee wiki-worker-output/parse-validation.log

      - name: Review all live changes since original preservation baseline
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, sys
          comp=json.load(open('wiki-worker-output/full-backup/comparison-to-old-baseline.json'))
          rendered=json.load(open('wiki-worker-output/rendered/manifest.json'))
          targets={p['title'] for p in rendered['pages']}
          target_changed=[p for p in comp['changedPages'] if p['title'] in targets]
          target_added=[p for p in comp['addedPages'] if p in targets]
          target_removed=[p for p in comp['removedPages'] if p in targets]
          unrelated=[p for p in comp['changedPages'] if p['title'] not in targets]
          report={
            'allChangedPages': comp['changedPages'],
            'allAddedPages': comp['addedPages'],
            'allRemovedPages': comp['removedPages'],
            'changedPublishTargets': target_changed,
            'addedPublishTargets': target_added,
            'removedPublishTargets': target_removed,
            'preservedUnrelatedChanges': unrelated,
          }
          open('wiki-worker-output/change-review.json','w').write(json.dumps(report,indent=2)+'\n')
          print(json.dumps(report, indent=2))
          if target_changed or target_added or target_removed:
              print('A page targeted by the redesign changed after the original preservation snapshot. Full backup is complete; stopping for review before overwrite.', file=sys.stderr)
              sys.exit(1)
          print('All post-baseline edits are outside publish targets and will be preserved.')
          PY

      - name: Require configured wiki credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$WIKI_BOT_USERNAME" || { echo 'Missing WIKI_BOT_USERNAME/MIRAHEZE_BOT_USERNAME/WIKI_USERNAME secret'; exit 1; }
          test -n "$WIKI_BOT_PASSWORD" || { echo 'Missing WIKI_BOT_PASSWORD/MIRAHEZE_BOT_PASSWORD/WIKI_PASSWORD secret'; exit 1; }

      - name: Publish to Miraheze from fresh backup revision set
        shell: bash
        run: |
          set -euo pipefail
          python3 wiki-worker/publish.py | tee wiki-worker-output/publish.log

      - name: Upload publish evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: enthusia-wiki-publish-evidence-${{ github.run_id }}
          path: wiki-worker-output/
          if-no-files-found: warn
          retention-days: 90
