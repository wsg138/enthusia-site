name: Site validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npm test
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Verify offline profile backup exporter
        run: |
          python -m pip install -r scripts/requirements-profile-export.txt
          python -m unittest discover -s tests/offline-profile -v
      - run: npm run build
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: minecraft/competition-bridge/pom.xml
      - name: Verify competition bridge
        run: mvn -B -f minecraft/competition-bridge/pom.xml verify
      - name: Verify live Paper 26.2 compatibility
        run: mvn -B -f minecraft/competition-bridge/pom.xml -Ppaper-26-2 clean verify
      - name: Verify actual website signer against native competition bridge
        run: node scripts/verify-competition-bridge.mjs
      - name: Upload verified competition bridge JAR
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: EnthusiaCompetitionBridge-${{ github.event.pull_request.head.sha || github.sha }}
          path: minecraft/competition-bridge/target/competition-bridge-1.0.0-SNAPSHOT.jar
          if-no-files-found: error
          retention-days: 14
