name: Publish Enthusia mobile corrections

on:
  pull_request:
    branches: [main]
    paths:
      - 'wiki-mobile-corrections-trigger.txt'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: enthusia-wiki-mobile-corrections
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WIKI_API: https://enthusia.miraheze.org/w/api.php
      WIKI_MOBILE_FIX_OUT: wiki-mobile-fix-output
      WIKI_FULL_BACKUP_OUT: wiki-mobile-fix-output/full-backup
      WIKI_BOT_USERNAME: ${{ secrets.WIKI_BOT_USERNAME || secrets.MIRAHEZE_BOT_USERNAME || secrets.WIKI_USERNAME }}
      WIKI_BOT_PASSWORD: ${{ secrets.WIKI_BOT_PASSWORD || secrets.MIRAHEZE_BOT_PASSWORD || secrets.WIKI_PASSWORD }}

    steps:
      - name: Check out proposed source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate correction sources
        shell: bash
        run: |
          set -euo pipefail
          node --check wiki-worker/mobile-corrections.js
          python3 -m py_compile wiki-worker/publish-mobile-corrections.py
          test -s wiki-worker/mobile-corrections.css
          grep -q 'repeat(3' wiki-worker/mobile-corrections.css
          grep -q 'enthusia-native-menu-sections' wiki-worker/mobile-corrections.js
          grep -q 'stopImmediatePropagation' wiki-worker/mobile-corrections.js
          grep -q 'Enthusia-logo-v2.png' wiki-worker/mobile-corrections.js
          grep -q 'linear-gradient(90deg, #ff4b12' wiki-worker/mobile-corrections.css

      - name: Capture complete live wiki before edits
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p wiki-mobile-fix-output
          python3 wiki-worker/full_backup.py | tee wiki-mobile-fix-output/full-backup.log
          test -s wiki-mobile-fix-output/full-backup/manifest.json
          pages="$(find wiki-mobile-fix-output/full-backup/pages -type f -name '*.wiki' | wc -l | tr -d ' ')"
          histories="$(find wiki-mobile-fix-output/full-backup/history -type f -name '*.json' | wc -l | tr -d ' ')"
          echo "full_backup_pages=$pages histories=$histories"
          test "$pages" -gt 0
          test "$histories" -eq "$pages"

      - name: Upload immutable pre-edit backup
        uses: actions/upload-artifact@v4
        with:
          name: enthusia-wiki-mobile-corrections-backup-${{ github.run_id }}
          path: wiki-mobile-fix-output/
          if-no-files-found: error
          retention-days: 90

      - name: Require configured wiki credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$WIKI_BOT_USERNAME"
          test -n "$WIKI_BOT_PASSWORD"

      - name: Publish mobile corrections
        shell: bash
        run: |
          set -euo pipefail
          python3 wiki-worker/publish-mobile-corrections.py | tee wiki-mobile-fix-output/publish-mobile-corrections.log

      - name: Upload publication evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: enthusia-wiki-mobile-corrections-evidence-${{ github.run_id }}
          path: wiki-mobile-fix-output/
          if-no-files-found: warn
          retention-days: 90
