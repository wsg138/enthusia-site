name: Diagnose live mobile wiki markup

on:
  pull_request:
    branches: [main]
    paths:
      - 'wiki-mobile-markup-diagnostic-trigger.txt'
      - 'wiki-worker/diagnose_mobile_runtime.mjs'
      - 'wiki-worker/preview_mobile_candidate.mjs'
      - 'wiki-worker/mobile-corrections.js'
      - 'wiki-worker/mobile-native-sidebar.css'
      - '.github/workflows/wiki-mobile-markup-diagnostic.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Capture live mobile markup
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p mobile-markup-diagnostic
          UA='Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.0 Mobile/15E148 Safari/604.1'
          for url in \
            'https://enthusia.miraheze.org/wiki/Main_Page' \
            'https://enthusia.miraheze.org/wiki/Main_Page?useskin=minerva' \
            'https://enthusia.miraheze.org/wiki/Main_Page?useskin=vector-2022'; do
            name="$(echo "$url" | sed 's#https://##; s#[/?=&]#_#g')"
            curl --fail-with-body -L --compressed -A "$UA" -D "mobile-markup-diagnostic/${name}.headers" -o "mobile-markup-diagnostic/${name}.html" "$url"
          done
          python3 - <<'PY'
          from pathlib import Path
          import re
          out=[]
          for path in sorted(Path('mobile-markup-diagnostic').glob('*.html')):
              text=path.read_text(encoding='utf-8', errors='replace')
              out.append(f'=== {path.name} ===')
              body=re.search(r'<body\b[^>]*>', text, re.I)
              out.append('BODY: ' + (body.group(0)[:1000] if body else 'not found'))
              for needle in ['mw-mf-main-menu-button','main-menu-button','mw-mf-page-left','navigation-drawer','vector-main-menu-dropdown','vector-main-menu','minerva-header','header-container','menu__list','toggle-list','overlay']:
                  matches=[]
                  for m in re.finditer(needle, text, re.I):
                      s=max(0,m.start()-350); e=min(len(text),m.end()+650)
                      snippet=re.sub(r'\s+',' ',text[s:e])
                      matches.append(snippet[:1200])
                      if len(matches)>=4: break
                  out.append(f'-- {needle} ({len(matches)}) --')
                  out.extend(matches or ['none'])
          Path('mobile-markup-diagnostic/summary.txt').write_text('\n'.join(out), encoding='utf-8')
          PY
          cat mobile-markup-diagnostic/summary.txt
      - name: Install browser harness
        shell: bash
        run: |
          set -euo pipefail
          command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser
          npm install --no-save --ignore-scripts puppeteer-core@24.16.0
      - name: Inspect current live mobile behavior
        shell: bash
        run: |
          set -euo pipefail
          node wiki-worker/diagnose_mobile_runtime.mjs
      - name: Acceptance-test candidate on live Minerva DOM
        shell: bash
        run: |
          set -euo pipefail
          node --check wiki-worker/mobile-corrections.js
          node wiki-worker/preview_mobile_candidate.mjs
      - name: Upload diagnostic markup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wiki-mobile-markup-diagnostic-${{ github.run_id }}
          path: mobile-markup-diagnostic/
          if-no-files-found: error
          retention-days: 14
