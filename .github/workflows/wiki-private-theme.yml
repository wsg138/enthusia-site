name: Stage Enthusia wiki private theme support

on:
  pull_request:
    branches: [main]
    paths:
      - 'wiki-private-theme-trigger.txt'

permissions:
  contents: read

concurrency:
  group: enthusia-wiki-private-theme
  cancel-in-progress: false

jobs:
  stage:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WIKI_API: https://enthusia.miraheze.org/w/api.php
      WIKI_FULL_BACKUP_OUT: wiki-private-theme-output/full-backup
      WIKI_BOT_USERNAME: ${{ secrets.WIKI_BOT_USERNAME }}
      WIKI_BOT_PASSWORD: ${{ secrets.WIKI_BOT_PASSWORD }}
    steps:
      - name: Check out private theme source
        uses: actions/checkout@v4

      - name: Validate private theme CSS and JavaScript
        shell: bash
        run: |
          set -euo pipefail
          test -s wiki-worker/private-stage-theme.css
          test -s wiki-worker/private-stage-theme.js
          node --check wiki-worker/private-stage-theme.js
          python3 - <<'PY'
          from pathlib import Path
          css = Path('wiki-worker/private-stage-theme.css').read_text(encoding='utf-8')
          js = Path('wiki-worker/private-stage-theme.js').read_text(encoding='utf-8')
          assert 'Private staging pass 6' in css
          assert 'data-enthusia-color-scheme="light"' in css
          assert 'Private staging pass 6' in js
          assert 'skin-theme-clientpref-night' in js
          assert 'skin-theme-clientpref-day' in js
          assert "prefers-color-scheme: dark" in js
          print('Private light/dark/automatic theme source validation passed.')
          PY

      - name: Capture complete live wiki before private theme stage
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p wiki-private-theme-output
          python3 wiki-worker/full_backup.py | tee wiki-private-theme-output/full-backup.log
          test -s wiki-private-theme-output/full-backup/manifest.json
          pages="$(find wiki-private-theme-output/full-backup/pages -type f -name '*.wiki' | wc -l | tr -d ' ')"
          histories="$(find wiki-private-theme-output/full-backup/history -type f -name '*.json' | wc -l | tr -d ' ')"
          echo "full_backup_pages=$pages histories=$histories"
          test "$pages" -gt 0
          test "$histories" -eq "$pages"

      - name: Upload immutable pre-stage backup
        uses: actions/upload-artifact@v4
        with:
          name: enthusia-wiki-private-theme-backup-${{ github.run_id }}
          path: wiki-private-theme-output/
          if-no-files-found: error
          retention-days: 90

      - name: Publish P2wn-only native theme support
        shell: bash
        run: |
          set -euo pipefail
          test -n "$WIKI_BOT_USERNAME"
          test -n "$WIKI_BOT_PASSWORD"
          python3 - <<'PY'
          import http.cookiejar, json, os, time, urllib.parse, urllib.request
          from pathlib import Path

          API = os.environ['WIKI_API']
          USERNAME = os.environ['WIKI_BOT_USERNAME'].strip()
          PASSWORD = os.environ['WIKI_BOT_PASSWORD']
          EXPECTED_USER = 'P2wn'
          OUT = Path('wiki-private-theme-output')
          COMMENT = 'Private light/dark/automatic theme support for Enthusia wiki redesign'
          targets = [
              {
                  'title': 'User:P2wn/common.css',
                  'path': Path('wiki-worker/private-stage-theme.css'),
                  'marker': '/* Private staging pass 6: restore native light/dark/automatic theme behavior. */',
                  'base_revid': 667,
                  'models': ('css', 'text/css'),
              },
              {
                  'title': 'User:P2wn/common.js',
                  'path': Path('wiki-worker/private-stage-theme.js'),
                  'marker': '/* Private staging pass 6: map Vector Appearance (Automatic/Light/Dark) to the redesign. */',
                  'base_revid': 668,
                  'models': ('javascript', 'text/javascript'),
              },
          ]

          jar = http.cookiejar.CookieJar()
          opener = urllib.request.build_opener(urllib.request.HTTPCookieProcessor(jar))

          def api(params, method='POST'):
              full = {'format':'json','formatversion':'2','maxlag':'5', **params}
              headers = {'User-Agent':'EnthusiaWikiPrivateTheme/1.0','Accept':'application/json'}
              if method == 'GET':
                  req = urllib.request.Request(API + '?' + urllib.parse.urlencode(full), headers=headers)
              else:
                  headers['Content-Type'] = 'application/x-www-form-urlencoded;charset=UTF-8'
                  req = urllib.request.Request(API, data=urllib.parse.urlencode(full).encode(), headers=headers)
              with opener.open(req, timeout=60) as response:
                  result = json.loads(response.read().decode())
              if result.get('error'):
                  raise RuntimeError(f"MediaWiki API error: {result['error']}")
              return result

          token = api({'action':'query','meta':'tokens','type':'login'}, 'GET')['query']['tokens']['logintoken']
          login = api({'action':'login','lgname':USERNAME,'lgpassword':PASSWORD,'lgtoken':token})
          if login.get('login',{}).get('result') != 'Success':
              raise RuntimeError(f'Wiki login failed: {login.get("login")}')
          csrf = api({'action':'query','meta':'tokens'}, 'GET')['query']['tokens']['csrftoken']
          who = api({'action':'query','meta':'userinfo'}, 'GET')['query']['userinfo']
          if who.get('name') != EXPECTED_USER:
              raise RuntimeError(f'Private theme stage requires {EXPECTED_USER}; authenticated as {who.get("name")}')

          def read_page(title):
              result = api({'action':'query','prop':'revisions|info','titles':title,'rvprop':'ids|timestamp|user|comment|content|contentmodel','rvslots':'main','curtimestamp':'1'}, 'GET')
              page = result['query']['pages'][0]
              if page.get('missing'):
                  raise RuntimeError(f'{title} is unexpectedly missing')
              rev = page['revisions'][0]
              slot = rev['slots']['main']
              return {
                  'revid': rev['revid'],
                  'timestamp': rev['timestamp'],
                  'comment': rev.get('comment') or '',
                  'content': slot.get('content',''),
                  'contentmodel': slot.get('contentmodel') or rev.get('contentmodel'),
                  'curtimestamp': result.get('curtimestamp'),
              }

          # Read and validate both pages before making either edit.
          states = {}
          for target in targets:
              before = read_page(target['title'])
              if before['contentmodel'] not in target['models']:
                  raise RuntimeError(f"Unexpected content model for {target['title']}: {before['contentmodel']}")
              block = target['path'].read_text(encoding='utf-8').rstrip()
              current = before['content'].rstrip()
              if target['marker'] in current:
                  if current.count(target['marker']) != 1:
                      raise RuntimeError(f"Theme marker appears more than once in {target['title']}")
                  existing = current[current.index(target['marker']):].rstrip()
                  if existing != block:
                      raise RuntimeError(f"Theme marker exists but live block differs from approved source in {target['title']}")
              elif before['revid'] != target['base_revid']:
                  raise RuntimeError(f"Expected {target['title']} rev {target['base_revid']}; found {before['revid']}")
              states[target['title']] = (before, block)

          reports = []
          for target in targets:
              before, block = states[target['title']]
              current = before['content'].rstrip()
              report = {'target':target['title'],'beforeRevid':before['revid']}
              if target['marker'] in current:
                  print(f"PRIVATE THEME ALREADY CURRENT {target['title']} rev {before['revid']}")
                  report.update({'result':'already-current','afterRevid':before['revid']})
              else:
                  desired = current + '\n\n' + block + '\n'
                  edit = api({'action':'edit','title':target['title'],'text':desired,'token':csrf,'summary':COMMENT,'assert':'user','watchlist':'nochange','basetimestamp':before['timestamp'],'starttimestamp':before['curtimestamp']})
                  e = edit.get('edit') or {}
                  if e.get('result') != 'Success':
                      raise RuntimeError(f"Private theme edit failed for {target['title']}: {e}")
                  time.sleep(1)
                  after = read_page(target['title'])
                  if after['content'].rstrip() != desired.rstrip():
                      raise RuntimeError(f"Private theme exact readback failed for {target['title']}")
                  if after['comment'] != COMMENT:
                      raise RuntimeError(f"Private theme edit summary mismatch for {target['title']}")
                  print(f"PRIVATE THEME PUBLISHED {target['title']}: {before['revid']} -> {after['revid']}")
                  report.update({'result':'published','afterRevid':after['revid']})
              reports.append(report)

          OUT.mkdir(parents=True, exist_ok=True)
          (OUT / 'private-theme-report.json').write_text(json.dumps(reports, indent=2) + '\n', encoding='utf-8')
          print('PRIVATE THEME verified by exact API readback')
          PY

      - name: Upload private theme evidence
        uses: actions/upload-artifact@v4
        with:
          name: enthusia-wiki-private-theme-evidence-${{ github.run_id }}
          path: wiki-private-theme-output/
          if-no-files-found: warn
          retention-days: 90
