name: Publish wiki card icon style match

on:
  pull_request:
    paths:
      - 'wiki-card-icon-style-trigger.txt'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    env:
      WIKI_API: https://enthusia.miraheze.org/w/api.php
      WIKI_FULL_BACKUP_OUT: wiki-card-icon-style-output/full-backup
      WIKI_ICON_OUT: wiki-card-icon-style-output
      WIKI_BOT_USERNAME: ${{ secrets.WIKI_BOT_USERNAME || secrets.MIRAHEZE_BOT_USERNAME || secrets.WIKI_USERNAME }}
      WIKI_BOT_PASSWORD: ${{ secrets.WIKI_BOT_PASSWORD || secrets.MIRAHEZE_BOT_PASSWORD || secrets.WIKI_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate icon sources
        run: |
          set -euo pipefail
          python3 -m py_compile wiki-worker/card-icons/publish-style-match.py
          for f in Commands.svg Market.svg Warzone.svg HistoryLore.svg; do
            test -s "wiki-worker/card-icons/$f"
            grep -q 'linearGradient id="tile"' "wiki-worker/card-icons/$f"
            grep -q 'stroke-width="1.2' "wiki-worker/card-icons/$f" || grep -q 'stroke-width="1.28"' "wiki-worker/card-icons/$f"
          done
          grep -q 'sword' wiki-worker/card-icons/Warzone.svg || true
      - name: Capture complete live wiki before edits
        run: |
          set -euo pipefail
          mkdir -p wiki-card-icon-style-output
          python3 wiki-worker/full_backup.py | tee wiki-card-icon-style-output/full-backup.log
          test -s wiki-card-icon-style-output/full-backup/manifest.json
          pages="$(find wiki-card-icon-style-output/full-backup/pages -type f -name '*.wiki' | wc -l | tr -d ' ')"
          histories="$(find wiki-card-icon-style-output/full-backup/history -type f -name '*.json' | wc -l | tr -d ' ')"
          test "$pages" -gt 0
          test "$histories" -eq "$pages"
      - name: Upload immutable pre-edit backup
        uses: actions/upload-artifact@v4
        with:
          name: enthusia-wiki-card-icon-style-backup-${{ github.run_id }}
          path: wiki-card-icon-style-output/
          retention-days: 90
      - name: Publish four icon files
        run: |
          set -euo pipefail
          test -n "$WIKI_BOT_USERNAME"
          test -n "$WIKI_BOT_PASSWORD"
          python3 wiki-worker/card-icons/publish-style-match.py | tee wiki-card-icon-style-output/publish.log
      - name: Upload publication evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: enthusia-wiki-card-icon-style-evidence-${{ github.run_id }}
          path: wiki-card-icon-style-output/
          if-no-files-found: warn
          retention-days: 90
