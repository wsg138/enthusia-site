name: Publish mobile sidebar close controls

on:
  pull_request:
    branches: [main]
    paths:
      - 'wiki-worker/mobile-sidebar-close-controls.js'
      - 'wiki-worker/mobile-sidebar-close-controls.css'
      - 'wiki-worker/publish-mobile-sidebar-close-controls.py'
      - 'wiki-worker/validate-live-mobile-sidebar-close.mjs'
      - 'wiki-mobile-sidebar-close-trigger.txt'
      - '.github/workflows/wiki-mobile-sidebar-close.yml'

permissions:
  contents: read

jobs:
  publish-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WIKI_API: https://enthusia.miraheze.org/w/api.php
      WIKI_CLOSE_OUT: wiki-close-output
      WIKI_FULL_BACKUP_OUT: wiki-close-output/full-backup
      WIKI_BOT_USERNAME: ${{ secrets.WIKI_BOT_USERNAME }}
      WIKI_BOT_PASSWORD: ${{ secrets.WIKI_BOT_PASSWORD }}
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Validate close-control sources
        shell: bash
        run: |
          set -euo pipefail
          node --check wiki-worker/mobile-sidebar-close-controls.js
          node --check wiki-worker/validate-live-mobile-sidebar-close.mjs
          python3 -m py_compile wiki-worker/publish-mobile-sidebar-close-controls.py
          grep -q 'closeMinervaMenu' wiki-worker/mobile-sidebar-close-controls.js
          grep -q 'enthusia-native-sidebar-close' wiki-worker/mobile-sidebar-close-controls.js
          grep -q '.main-menu-mask' wiki-worker/mobile-sidebar-close-controls.js
          grep -q 'enthusia-native-sidebar-close' wiki-worker/mobile-sidebar-close-controls.css

      - name: Capture complete live wiki before edit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$WIKI_CLOSE_OUT"
          python3 wiki-worker/full_backup.py | tee "$WIKI_CLOSE_OUT/full-backup.log"
          test -s "$WIKI_FULL_BACKUP_OUT/manifest.json"
          pages="$(find "$WIKI_FULL_BACKUP_OUT/pages" -type f -name '*.wiki' | wc -l | tr -d ' ')"
          histories="$(find "$WIKI_FULL_BACKUP_OUT/history" -type f -name '*.json' | wc -l | tr -d ' ')"
          echo "full_backup_pages=$pages histories=$histories"
          test "$pages" -gt 0
          test "$histories" -eq "$pages"

      - name: Upload immutable pre-edit backup
        uses: actions/upload-artifact@v4
        with:
          name: enthusia-wiki-sidebar-close-backup-${{ github.run_id }}
          path: wiki-close-output/
          if-no-files-found: error
          retention-days: 90

      - name: Require wiki credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$WIKI_BOT_USERNAME"
          test -n "$WIKI_BOT_PASSWORD"

      - name: Publish close controls
        shell: bash
        run: |
          set -euo pipefail
          python3 wiki-worker/publish-mobile-sidebar-close-controls.py | tee "$WIKI_CLOSE_OUT/publish.log"

      - name: Install browser acceptance harness
        shell: bash
        run: |
          set -euo pipefail
          command -v google-chrome || command -v google-chrome-stable || command -v chromium
          npm install --no-save --ignore-scripts puppeteer-core@24.16.0

      - name: Acceptance-test X and backdrop close paths
        shell: bash
        run: |
          set -euo pipefail
          node wiki-worker/validate-live-mobile-sidebar-close.mjs | tee "$WIKI_CLOSE_OUT/browser-close.log"

      - name: Upload publication and visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: enthusia-wiki-sidebar-close-evidence-${{ github.run_id }}
          path: wiki-close-output/
          if-no-files-found: warn
          retention-days: 90
