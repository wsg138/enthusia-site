name: Publish stable wiki sidebar links

on:
  pull_request:
    branches: [main]
    paths:
      - 'wiki-worker/publish-stable-sidebar-links.py'
      - '.github/workflows/wiki-stable-sidebar-publish.yml'

permissions:
  contents: read

concurrency:
  group: enthusia-wiki-stable-sidebar
  cancel-in-progress: false

jobs:
  backup-publish-verify:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WIKI_API: https://enthusia.miraheze.org/w/api.php
      WIKI_SIDEBAR_OUT: wiki-stable-sidebar-output
      WIKI_FULL_BACKUP_OUT: wiki-stable-sidebar-output/full-backup
      WIKI_BOT_USERNAME: ${{ secrets.WIKI_BOT_USERNAME || secrets.MIRAHEZE_BOT_USERNAME || secrets.WIKI_USERNAME }}
      WIKI_BOT_PASSWORD: ${{ secrets.WIKI_BOT_PASSWORD || secrets.MIRAHEZE_BOT_PASSWORD || secrets.WIKI_PASSWORD }}
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Validate publisher source
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile wiki-worker/publish-stable-sidebar-links.py
          python3 -m py_compile wiki-worker/full_backup.py

      - name: Capture complete current live wiki immediately before edit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$WIKI_SIDEBAR_OUT"
          python3 wiki-worker/full_backup.py | tee "$WIKI_SIDEBAR_OUT/full-backup.log"
          test -s "$WIKI_FULL_BACKUP_OUT/manifest.json"
          pages="$(find "$WIKI_FULL_BACKUP_OUT/pages" -type f -name '*.wiki' | wc -l | tr -d ' ')"
          histories="$(find "$WIKI_FULL_BACKUP_OUT/history" -type f -name '*.json' | wc -l | tr -d ' ')"
          echo "full_backup_pages=$pages histories=$histories"
          test "$pages" -gt 0
          test "$histories" -eq "$pages"

      - name: Upload immutable pre-edit backup
        uses: actions/upload-artifact@v4
        with:
          name: enthusia-wiki-stable-sidebar-backup-${{ github.run_id }}
          path: wiki-stable-sidebar-output/full-backup/
          if-no-files-found: error
          retention-days: 90

      - name: Require configured wiki credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$WIKI_BOT_USERNAME" || { echo 'Missing wiki username secret'; exit 1; }
          test -n "$WIKI_BOT_PASSWORD" || { echo 'Missing wiki password secret'; exit 1; }

      - name: Publish exactly the two stable sidebar targets
        shell: bash
        run: |
          set -euo pipefail
          python3 wiki-worker/publish-stable-sidebar-links.py | tee "$WIKI_SIDEBAR_OUT/publish.log"
          test -s "$WIKI_SIDEBAR_OUT/publish-evidence.json"

      - name: Verify no Guilds or Players page content was modified
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          evidence=json.loads(Path('wiki-stable-sidebar-output/publish-evidence.json').read_text())
          assert evidence['beforeSha256'] != evidence['targetSha256'] or evidence['changedLineCount'] == 0
          assert evidence['targetSha256'] == evidence['afterSha256']
          assert evidence['changedLineCount'] <= 2
          assert set(evidence['stablePagesPreserved']) == {'Guilds','Players'}
          for change in evidence['changes']:
              assert change['newTarget'] in {'Guilds','Players'}
          print(json.dumps(evidence, indent=2))
          PY

      - name: Upload publication evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: enthusia-wiki-stable-sidebar-evidence-${{ github.run_id }}
          path: |
            wiki-stable-sidebar-output/publish.log
            wiki-stable-sidebar-output/publish-evidence.json
            wiki-stable-sidebar-output/sidebar-before.wiki
            wiki-stable-sidebar-output/sidebar-target.wiki
          if-no-files-found: warn
          retention-days: 90
