name: Validate Enthusia wiki preview

on:
  pull_request:
    branches: [main]
    paths:
      - 'public/wiki-demo/**'
      - 'wiki-worker/render_pages.mjs'
      - 'wiki-worker/wiki-template.css'
      - 'wiki-worker/validate_structure.mjs'
      - 'wiki-mobile-markup-diagnostic-trigger.txt'
      - '.github/workflows/wiki-preview-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WIKI_API: https://enthusia.miraheze.org/w/api.php
      WIKI_WORKER_OUT: wiki-worker-output

    steps:
      - name: Check out candidate
        uses: actions/checkout@v4

      - name: Confirm source set
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            public/wiki-demo/v2-core.js \
            public/wiki-demo/v2-support.js \
            public/wiki-demo/v2-commands.js \
            public/wiki-demo/v2-detail.js \
            public/wiki-demo/v2-final.js \
            public/wiki-demo/v2-polish.js \
            public/wiki-demo/v2-reputation.js \
            wiki-worker/wiki-template.css \
            wiki-worker/validate_structure.mjs; do
            test -s "$file"
          done

      - name: Render candidate
        shell: bash
        run: |
          set -euo pipefail
          node --check wiki-worker/render_pages.mjs
          node wiki-worker/render_pages.mjs
          test -s wiki-worker-output/rendered/manifest.json

      - name: Validate translated component structure
        shell: bash
        run: |
          set -euo pipefail
          node --check wiki-worker/validate_structure.mjs
          node wiki-worker/validate_structure.mjs | tee wiki-worker-output/structure-validation.log
          grep -q '"ok": true' wiki-worker-output/structure-validation.json

      - name: Player-facing content guardrails
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R -E -i '(/casino|/spin|/arm)([^a-z]|$)' wiki-worker-output/rendered
          ! grep -R -E -i 'velocity\.hub|/gmc([^a-z]|$)' wiki-worker-output/rendered
          ! grep -R -E -i 'movement[- ]speed|speed boost' wiki-worker-output/rendered
          grep -R -q 'PieCloak' wiki-worker-output/rendered
          grep -R -q 'outside Spawn and the Warzone' wiki-worker-output/rendered || grep -R -q 'Outside Spawn and the Warzone' wiki-worker-output/rendered

      - name: Validate candidate with Miraheze parser
        shell: bash
        run: |
          set -euo pipefail
          python3 wiki-worker/validate_rendered.py | tee wiki-worker-output/parse-validation.log

      - name: Capture live mobile markup for this fix
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p wiki-worker-output/mobile-markup
          UA='Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.0 Mobile/15E148 Safari/604.1'
          for spec in \
            'default|https://enthusia.miraheze.org/wiki/Main_Page' \
            'minerva|https://enthusia.miraheze.org/wiki/Main_Page?useskin=minerva' \
            'vector|https://enthusia.miraheze.org/wiki/Main_Page?useskin=vector-2022'; do
            name="${spec%%|*}"
            url="${spec#*|}"
            curl --fail-with-body -L --compressed -A "$UA" -D "wiki-worker-output/mobile-markup/${name}.headers" -o "wiki-worker-output/mobile-markup/${name}.html" "$url"
          done
          python3 - <<'PY'
          from pathlib import Path
          import re
          lines=[]
          needles=['mw-mf-main-menu-button','main-menu-button','mw-mf-page-left','navigation-drawer','vector-main-menu-dropdown','vector-main-menu','minerva-header','header-container','menu__list','toggle-list','overlay','mw-mf-page-center']
          for path in sorted(Path('wiki-worker-output/mobile-markup').glob('*.html')):
              text=path.read_text(encoding='utf-8', errors='replace')
              lines.append(f'=== {path.name} ===')
              body=re.search(r'<body\b[^>]*>', text, re.I)
              lines.append('BODY: ' + (re.sub(r'\s+',' ',body.group(0))[:1500] if body else 'not found'))
              for needle in needles:
                  found=[]
                  for m in re.finditer(needle, text, re.I):
                      s=max(0,m.start()-500); e=min(len(text),m.end()+900)
                      found.append(re.sub(r'\s+',' ',text[s:e])[:1600])
                      if len(found)>=4: break
                  lines.append(f'-- {needle} ({len(found)}) --')
                  lines.extend(found or ['none'])
          out=Path('wiki-worker-output/mobile-markup/summary.txt')
          out.write_text('\n'.join(lines), encoding='utf-8')
          print(out.read_text())
          PY

      - name: Upload read-only validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: enthusia-wiki-readonly-validation-${{ github.run_id }}
          path: wiki-worker-output/
          if-no-files-found: warn
          retention-days: 30
