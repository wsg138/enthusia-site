name: Publish Enthusia Minerva mobile integration

on:
  pull_request:
    branches: [main]
    paths:
      - 'wiki-minerva-mobile-trigger.txt'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: enthusia-wiki-minerva-mobile
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WIKI_API: https://enthusia.miraheze.org/w/api.php
      WIKI_MINERVA_OUT: wiki-minerva-output
      WIKI_FULL_BACKUP_OUT: wiki-minerva-output/full-backup
      WIKI_BOT_USERNAME: ${{ secrets.WIKI_BOT_USERNAME || secrets.MIRAHEZE_BOT_USERNAME || secrets.WIKI_USERNAME }}
      WIKI_BOT_PASSWORD: ${{ secrets.WIKI_BOT_PASSWORD || secrets.MIRAHEZE_BOT_PASSWORD || secrets.WIKI_PASSWORD }}

    steps:
      - name: Check out proposed source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate Minerva integration sources
        shell: bash
        run: |
          set -euo pipefail
          node --check wiki-worker/mobile-minerva-integration.js
          python3 -m py_compile wiki-worker/publish-mobile-minerva.py
          test -s wiki-worker/mobile-minerva-integration.css
          grep -q 'enthusia-minerva-brand' wiki-worker/mobile-minerva-integration.css
          grep -q 'HAMBURGER_SELECTOR' wiki-worker/mobile-minerva-integration.js
          grep -q 'NATIVE_TOGGLE_SELECTOR' wiki-worker/mobile-minerva-integration.js
          grep -q 'bottomMenuButton' wiki-worker/mobile-minerva-integration.js
          grep -q 'enthusia-mobile-drawer' wiki-worker/mobile-minerva-integration.js

      - name: Capture complete live wiki before edits
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p wiki-minerva-output
          python3 wiki-worker/full_backup.py | tee wiki-minerva-output/full-backup.log
          test -s wiki-minerva-output/full-backup/manifest.json
          pages="$(find wiki-minerva-output/full-backup/pages -type f -name '*.wiki' | wc -l | tr -d ' ')"
          histories="$(find wiki-minerva-output/full-backup/history -type f -name '*.json' | wc -l | tr -d ' ')"
          echo "full_backup_pages=$pages histories=$histories"
          test "$pages" -gt 0
          test "$histories" -eq "$pages"

      - name: Upload immutable pre-edit backup
        uses: actions/upload-artifact@v4
        with:
          name: enthusia-wiki-minerva-backup-${{ github.run_id }}
          path: wiki-minerva-output/
          if-no-files-found: error
          retention-days: 90

      - name: Require configured wiki credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$WIKI_BOT_USERNAME"
          test -n "$WIKI_BOT_PASSWORD"

      - name: Publish Minerva integration
        shell: bash
        run: |
          set -euo pipefail
          python3 wiki-worker/publish-mobile-minerva.py | tee wiki-minerva-output/publish-mobile-minerva.log

      - name: Upload publication evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: enthusia-wiki-minerva-evidence-${{ github.run_id }}
          path: wiki-minerva-output/
          if-no-files-found: warn
          retention-days: 90
