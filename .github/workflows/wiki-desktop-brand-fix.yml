name: Publish Enthusia desktop brand fix

on:
  pull_request:
    branches: [main]
    paths:
      - 'wiki-desktop-brand-fix-trigger.txt'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: enthusia-wiki-desktop-brand-fix
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WIKI_API: https://enthusia.miraheze.org/w/api.php
      WIKI_DESKTOP_BRAND_OUT: wiki-desktop-brand-output
      WIKI_FULL_BACKUP_OUT: wiki-desktop-brand-output/full-backup
      WIKI_BOT_USERNAME: ${{ secrets.WIKI_BOT_USERNAME || secrets.MIRAHEZE_BOT_USERNAME || secrets.WIKI_USERNAME }}
      WIKI_BOT_PASSWORD: ${{ secrets.WIKI_BOT_PASSWORD || secrets.MIRAHEZE_BOT_PASSWORD || secrets.WIKI_PASSWORD }}

    steps:
      - name: Check out proposed source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate desktop brand fix sources
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile wiki-worker/publish-desktop-brand-fix.py
          test -s wiki-worker/mobile-shell.css
          python3 - <<'PY'
          from pathlib import Path
          css = Path('wiki-worker/mobile-shell.css').read_text()
          assert '.enthusia-site-brand {\n  display: none;\n}' in css
          mobile = css.split('@media (max-width: 800px)', 1)[1]
          assert '.enthusia-site-brand {\n    display: inline-flex;' in mobile
          PY

      - name: Capture complete live wiki before edits
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p wiki-desktop-brand-output
          python3 wiki-worker/full_backup.py | tee wiki-desktop-brand-output/full-backup.log
          test -s wiki-desktop-brand-output/full-backup/manifest.json
          pages="$(find wiki-desktop-brand-output/full-backup/pages -type f -name '*.wiki' | wc -l | tr -d ' ')"
          histories="$(find wiki-desktop-brand-output/full-backup/history -type f -name '*.json' | wc -l | tr -d ' ')"
          echo "full_backup_pages=$pages histories=$histories"
          test "$pages" -gt 0
          test "$histories" -eq "$pages"

      - name: Upload immutable pre-edit backup
        uses: actions/upload-artifact@v4
        with:
          name: enthusia-wiki-desktop-brand-backup-${{ github.run_id }}
          path: wiki-desktop-brand-output/
          if-no-files-found: error
          retention-days: 90

      - name: Require configured wiki credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$WIKI_BOT_USERNAME"
          test -n "$WIKI_BOT_PASSWORD"

      - name: Publish desktop brand fix
        shell: bash
        run: |
          set -euo pipefail
          python3 wiki-worker/publish-desktop-brand-fix.py | tee wiki-desktop-brand-output/publish-desktop-brand-fix.log

      - name: Upload publication evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: enthusia-wiki-desktop-brand-evidence-${{ github.run_id }}
          path: wiki-desktop-brand-output/
          if-no-files-found: warn
          retention-days: 90
