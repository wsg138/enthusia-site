name: Publish desktop wiki Appearance sidebar

on:
  pull_request:
    branches: [main]
    paths:
      - 'wiki-desktop-appearance-trigger.txt'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: enthusia-wiki-desktop-appearance
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WIKI_API: https://enthusia.miraheze.org/w/api.php
      WIKI_APPEARANCE_OUT: wiki-desktop-appearance-output
      WIKI_FULL_BACKUP_OUT: wiki-desktop-appearance-output/full-backup
      WIKI_BOT_USERNAME: ${{ secrets.WIKI_BOT_USERNAME || secrets.MIRAHEZE_BOT_USERNAME || secrets.WIKI_USERNAME }}
      WIKI_BOT_PASSWORD: ${{ secrets.WIKI_BOT_PASSWORD || secrets.MIRAHEZE_BOT_PASSWORD || secrets.WIKI_PASSWORD }}

    steps:
      - name: Check out proposed source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate desktop-only Appearance integration
        shell: bash
        run: |
          set -euo pipefail
          node --check wiki-worker/desktop-appearance-sidebar.js
          python3 -m py_compile wiki-worker/publish-desktop-appearance.py
          grep -q 'min-width: 801px' wiki-worker/desktop-appearance-sidebar.js
          grep -q 'pinnable-header.vector-appearance.pin' wiki-worker/desktop-appearance-sidebar.js
          grep -q '#vector-page-tools-pinned-container #vector-page-tools' wiki-worker/desktop-appearance-sidebar.js
          ! grep -q 'enthusia-mobile-drawer' wiki-worker/desktop-appearance-sidebar.js
          ! grep -q 'mw-mf-main-menu' wiki-worker/desktop-appearance-sidebar.js

      - name: Capture complete live wiki before edit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p wiki-desktop-appearance-output
          python3 wiki-worker/full_backup.py | tee wiki-desktop-appearance-output/full-backup.log
          test -s wiki-desktop-appearance-output/full-backup/manifest.json
          pages="$(find wiki-desktop-appearance-output/full-backup/pages -type f -name '*.wiki' | wc -l | tr -d ' ')"
          histories="$(find wiki-desktop-appearance-output/full-backup/history -type f -name '*.json' | wc -l | tr -d ' ')"
          echo "full_backup_pages=$pages histories=$histories"
          test "$pages" -gt 0
          test "$histories" -eq "$pages"

      - name: Upload immutable pre-edit backup
        uses: actions/upload-artifact@v4
        with:
          name: enthusia-wiki-desktop-appearance-backup-${{ github.run_id }}
          path: wiki-desktop-appearance-output/
          if-no-files-found: error
          retention-days: 90

      - name: Require wiki credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$WIKI_BOT_USERNAME"
          test -n "$WIKI_BOT_PASSWORD"

      - name: Publish desktop Appearance integration
        shell: bash
        run: |
          set -euo pipefail
          python3 wiki-worker/publish-desktop-appearance.py | tee wiki-desktop-appearance-output/publish.log

      - name: Upload publication evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: enthusia-wiki-desktop-appearance-evidence-${{ github.run_id }}
          path: wiki-desktop-appearance-output/
          if-no-files-found: warn
          retention-days: 90
