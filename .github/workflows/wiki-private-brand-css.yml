name: Stage private wiki brand CSS

on:
  pull_request:
    branches: [main]
    paths:
      - 'wiki-private-brand-css-trigger.txt'

permissions:
  contents: read

concurrency:
  group: enthusia-wiki-private-brand-css
  cancel-in-progress: false

jobs:
  stage:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WIKI_API: https://enthusia.miraheze.org/w/api.php
      WIKI_BRAND_OUT: wiki-private-brand-css-output
      WIKI_BOT_USERNAME: ${{ secrets.WIKI_BOT_USERNAME || secrets.MIRAHEZE_BOT_USERNAME || secrets.WIKI_USERNAME }}
      WIKI_BOT_PASSWORD: ${{ secrets.WIKI_BOT_PASSWORD || secrets.MIRAHEZE_BOT_PASSWORD || secrets.WIKI_PASSWORD }}

    steps:
      - name: Check out candidate
        uses: actions/checkout@v4

      - name: Validate private CSS source
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile wiki-worker/player-card-and-brand/publish_private_css.py
          test -s wiki-worker/player-card-and-brand/common-brand.css
          grep -q 'Enthusia-logo-v2.png' wiki-worker/player-card-and-brand/common-brand.css
          grep -q '#ff4b12' wiki-worker/player-card-and-brand/common-brand.css
          grep -q '#ff8a00' wiki-worker/player-card-and-brand/common-brand.css
          grep -q '#ffd36a' wiki-worker/player-card-and-brand/common-brand.css

      - name: Publish P2wn private brand CSS
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p wiki-private-brand-css-output
          python3 wiki-worker/player-card-and-brand/publish_private_css.py | tee wiki-private-brand-css-output/publish.log

      - name: Upload private CSS evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: enthusia-wiki-private-brand-css-evidence-${{ github.run_id }}
          path: wiki-private-brand-css-output/
          if-no-files-found: warn
          retention-days: 90
