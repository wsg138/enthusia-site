name: Inspect guild sidebar target

on:
  pull_request:
    branches: [main]
    paths:
      - 'wiki-worker/inspect-guild-sidebar-target.py'
      - '.github/workflows/wiki-guild-target-inspection.yml'

permissions:
  contents: read

jobs:
  inspect-guild-targets:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WIKI_API: https://enthusia.miraheze.org/w/api.php
      WIKI_FULL_BACKUP_OUT: wiki-guild-target-output/full-backup
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Validate scripts
        run: |
          set -euo pipefail
          python3 -m py_compile wiki-worker/full_backup.py wiki-worker/inspect-guild-sidebar-target.py
      - name: Capture complete live wiki
        run: |
          set -euo pipefail
          mkdir -p wiki-guild-target-output
          python3 wiki-worker/full_backup.py | tee wiki-guild-target-output/full-backup.log
      - name: Inspect guild-related pages and sidebar
        run: |
          set -euo pipefail
          python3 wiki-worker/inspect-guild-sidebar-target.py | tee wiki-guild-target-output/inspection.log
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: enthusia-wiki-guild-target-inspection-${{ github.run_id }}
          path: wiki-guild-target-output/
          if-no-files-found: error
          retention-days: 90
