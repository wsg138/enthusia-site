name: Rollback broken mobile wiki menu

on:
  pull_request:
    branches: [main]
    paths:
      - 'wiki-mobile-menu-rollback-trigger.txt'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: enthusia-wiki-mobile-menu-rollback
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WIKI_API: https://enthusia.miraheze.org/w/api.php
      WIKI_ROLLBACK_OUT: wiki-mobile-menu-rollback-output
      WIKI_FULL_BACKUP_OUT: wiki-mobile-menu-rollback-output/full-backup
      WIKI_BOT_USERNAME: ${{ secrets.WIKI_BOT_USERNAME || secrets.MIRAHEZE_BOT_USERNAME || secrets.WIKI_USERNAME }}
      WIKI_BOT_PASSWORD: ${{ secrets.WIKI_BOT_PASSWORD || secrets.MIRAHEZE_BOT_PASSWORD || secrets.WIKI_PASSWORD }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate rollback source
        run: |
          set -euo pipefail
          node --check wiki-worker/mobile-minerva-integration.js
          python3 -m py_compile wiki-worker/publish-mobile-menu-rollback.py
          ! grep -q 'NATIVE_TOGGLE_SELECTOR' wiki-worker/mobile-minerva-integration.js
          ! grep -q 'bottomMenuButton' wiki-worker/mobile-minerva-integration.js
      - name: Capture complete live wiki before rollback
        run: |
          set -euo pipefail
          mkdir -p wiki-mobile-menu-rollback-output
          python3 wiki-worker/full_backup.py | tee wiki-mobile-menu-rollback-output/full-backup.log
          pages="$(find wiki-mobile-menu-rollback-output/full-backup/pages -type f -name '*.wiki' | wc -l | tr -d ' ')"
          histories="$(find wiki-mobile-menu-rollback-output/full-backup/history -type f -name '*.json' | wc -l | tr -d ' ')"
          test "$pages" -gt 0
          test "$histories" -eq "$pages"
      - uses: actions/upload-artifact@v4
        with:
          name: enthusia-wiki-mobile-menu-rollback-backup-${{ github.run_id }}
          path: wiki-mobile-menu-rollback-output/
          if-no-files-found: error
          retention-days: 90
      - name: Require wiki credentials
        run: |
          test -n "$WIKI_BOT_USERNAME"
          test -n "$WIKI_BOT_PASSWORD"
      - name: Publish rollback
        run: python3 wiki-worker/publish-mobile-menu-rollback.py | tee wiki-mobile-menu-rollback-output/publish.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: enthusia-wiki-mobile-menu-rollback-evidence-${{ github.run_id }}
          path: wiki-mobile-menu-rollback-output/
          if-no-files-found: warn
          retention-days: 90
