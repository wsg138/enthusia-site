name: Stage Enthusia wiki private brand and player grid

on:
  pull_request:
    branches: [main]
    paths:
      - 'wiki-private-brand-player-trigger.txt'

permissions:
  contents: read

concurrency:
  group: enthusia-wiki-private-brand-player
  cancel-in-progress: false

jobs:
  stage:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WIKI_API: https://enthusia.miraheze.org/w/api.php
      WIKI_FULL_BACKUP_OUT: wiki-private-brand-player-output/full-backup
      WIKI_BOT_USERNAME: ${{ secrets.WIKI_BOT_USERNAME }}
      WIKI_BOT_PASSWORD: ${{ secrets.WIKI_BOT_PASSWORD }}
    steps:
      - name: Check out private stage source
        uses: actions/checkout@v4

      - name: Validate private CSS and JavaScript
        shell: bash
        run: |
          set -euo pipefail
          test -s wiki-worker/private-stage-brand-and-players.css
          test -s wiki-worker/private-stage-brand-and-players.js
          node --check wiki-worker/private-stage-brand-and-players.js
          python3 - <<'PY'
          from pathlib import Path
          css = Path('wiki-worker/private-stage-brand-and-players.css').read_text(encoding='utf-8')
          js = Path('wiki-worker/private-stage-brand-and-players.js').read_text(encoding='utf-8')
          assert css.count('{') == css.count('}'), 'unbalanced CSS braces'
          assert 'Private staging pass 6' in css and 'Private staging pass 6' in js
          assert '#ff4b12' in css and '#ff8a00' in css and '#ffd36a' in css
          assert 'enthusia-logo-v2.png' in js
          assert 'Noteable_Players' in js
          assert 'enthusia-player-image-link' in js
          print('Private brand/player stage validation passed.')
          PY

      - name: Capture complete live wiki before private stage
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p wiki-private-brand-player-output
          python3 wiki-worker/full_backup.py | tee wiki-private-brand-player-output/full-backup.log
          test -s wiki-private-brand-player-output/full-backup/manifest.json
          pages="$(find wiki-private-brand-player-output/full-backup/pages -type f -name '*.wiki' | wc -l | tr -d ' ')"
          histories="$(find wiki-private-brand-player-output/full-backup/history -type f -name '*.json' | wc -l | tr -d ' ')"
          echo "full_backup_pages=$pages histories=$histories"
          test "$pages" -gt 0
          test "$histories" -eq "$pages"

      - name: Upload immutable pre-stage backup
        uses: actions/upload-artifact@v4
        with:
          name: enthusia-wiki-private-brand-player-backup-${{ github.run_id }}
          path: wiki-private-brand-player-output/
          if-no-files-found: error
          retention-days: 90

      - name: Publish P2wn-only brand/player CSS and JS
        shell: bash
        run: |
          set -euo pipefail
          test -n "$WIKI_BOT_USERNAME"
          test -n "$WIKI_BOT_PASSWORD"
          python3 - <<'PY'
          import http.cookiejar, json, os, time, urllib.parse, urllib.request
          from pathlib import Path

          API = os.environ['WIKI_API']
          USERNAME = os.environ['WIKI_BOT_USERNAME'].strip()
          PASSWORD = os.environ['WIKI_BOT_PASSWORD']
          EXPECTED_USER = 'P2wn'
          OUT = Path('wiki-private-brand-player-output')
          targets = [
              {
                  'title':'User:P2wn/common.css',
                  'path':Path('wiki-worker/private-stage-brand-and-players.css'),
                  'marker':'/* Private staging pass 6: real Enthusia brand treatment and player-grid normalization. */',
                  'base':669,
                  'contentmodels':('css',),
                  'comment':'Private brand/player staging for Enthusia wiki redesign',
              },
              {
                  'title':'User:P2wn/common.js',
                  'path':Path('wiki-worker/private-stage-brand-and-players.js'),
                  'marker':'/* Private staging pass 6: install real Enthusia brand and normalize player cards. */',
                  'base':670,
                  'contentmodels':('javascript','text/javascript'),
                  'comment':'Private brand/player staging for Enthusia wiki redesign',
              },
          ]

          jar = http.cookiejar.CookieJar()
          opener = urllib.request.build_opener(urllib.request.HTTPCookieProcessor(jar))

          def api(params, method='POST'):
              full = {'format':'json','formatversion':'2','maxlag':'5', **params}
              headers = {'User-Agent':'EnthusiaWikiPrivateBrandPlayer/1.0','Accept':'application/json'}
              if method == 'GET':
                  req = urllib.request.Request(API + '?' + urllib.parse.urlencode(full), headers=headers)
              else:
                  headers['Content-Type'] = 'application/x-www-form-urlencoded;charset=UTF-8'
                  req = urllib.request.Request(API, data=urllib.parse.urlencode(full).encode(), headers=headers)
              with opener.open(req, timeout=60) as response:
                  result = json.loads(response.read().decode())
              if result.get('error'):
                  raise RuntimeError(f"MediaWiki API error: {result['error']}")
              return result

          token = api({'action':'query','meta':'tokens','type':'login'}, 'GET')['query']['tokens']['logintoken']
          login = api({'action':'login','lgname':USERNAME,'lgpassword':PASSWORD,'lgtoken':token})
          if login.get('login',{}).get('result') != 'Success':
              raise RuntimeError(f'Wiki login failed: {login.get("login")}')
          csrf = api({'action':'query','meta':'tokens'}, 'GET')['query']['tokens']['csrftoken']
          who = api({'action':'query','meta':'userinfo'}, 'GET')['query']['userinfo']
          if who.get('name') != EXPECTED_USER:
              raise RuntimeError(f'Private stage requires {EXPECTED_USER}; authenticated as {who.get("name")}')

          def read_page(title):
              result = api({'action':'query','prop':'revisions|info','titles':title,'rvprop':'ids|timestamp|user|comment|content|contentmodel','rvslots':'main','curtimestamp':'1'}, 'GET')
              page = result['query']['pages'][0]
              if page.get('missing'):
                  raise RuntimeError(f'{title} is unexpectedly missing')
              rev = page['revisions'][0]
              slot = rev['slots']['main']
              return {'revid':rev['revid'],'timestamp':rev['timestamp'],'comment':rev.get('comment') or '','content':slot.get('content',''),'contentmodel':slot.get('contentmodel') or rev.get('contentmodel'),'curtimestamp':result.get('curtimestamp')}

          reports=[]
          for target in targets:
              before = read_page(target['title'])
              if before['contentmodel'] not in target['contentmodels']:
                  raise RuntimeError(f"Unexpected content model for {target['title']}: {before['contentmodel']}")
              block = target['path'].read_text(encoding='utf-8').rstrip()
              current = before['content'].rstrip()
              report={'target':target['title'],'beforeRevid':before['revid']}

              if target['marker'] in current:
                  if current.count(target['marker']) != 1:
                      raise RuntimeError(f"Marker appears more than once in {target['title']}")
                  existing=current[current.index(target['marker']):].rstrip()
                  if existing != block:
                      raise RuntimeError(f"Live staged block differs from approved source in {target['title']}")
                  print(f"PRIVATE BRAND/PLAYER ALREADY CURRENT {target['title']} rev {before['revid']}")
                  report.update({'result':'already-current','afterRevid':before['revid']})
              else:
                  if before['revid'] != target['base']:
                      raise RuntimeError(f"Expected {target['title']} rev {target['base']}; found {before['revid']}")
                  desired=current + '\n\n' + block + '\n'
                  edit=api({'action':'edit','title':target['title'],'text':desired,'token':csrf,'summary':target['comment'],'assert':'user','watchlist':'nochange','basetimestamp':before['timestamp'],'starttimestamp':before['curtimestamp']})
                  e=edit.get('edit') or {}
                  if e.get('result') != 'Success':
                      raise RuntimeError(f"Private stage edit failed for {target['title']}: {e}")
                  time.sleep(1)
                  after=read_page(target['title'])
                  if after['content'].rstrip() != desired.rstrip():
                      raise RuntimeError(f"Exact readback failed for {target['title']}")
                  if after['comment'] != target['comment']:
                      raise RuntimeError(f"Edit-summary readback mismatch for {target['title']}")
                  print(f"PRIVATE BRAND/PLAYER PUBLISHED {target['title']}: {before['revid']} -> {after['revid']}")
                  report.update({'result':'published','afterRevid':after['revid']})
              reports.append(report)

          OUT.mkdir(parents=True, exist_ok=True)
          (OUT/'private-brand-player-report.json').write_text(json.dumps(reports, indent=2)+'\n',encoding='utf-8')
          print('PRIVATE BRAND/PLAYER verified by exact API readback')
          PY

      - name: Upload private stage evidence
        uses: actions/upload-artifact@v4
        with:
          name: enthusia-wiki-private-brand-player-evidence-${{ github.run_id }}
          path: wiki-private-brand-player-output/
          if-no-files-found: warn
          retention-days: 90
