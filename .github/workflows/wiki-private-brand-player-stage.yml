name: Stage Enthusia wiki private brand and player grid

on:
  pull_request:
    branches: [main]
    paths:
      - 'wiki-private-brand-player-trigger.txt'

permissions:
  contents: read

concurrency:
  group: enthusia-wiki-private-brand-player
  cancel-in-progress: false

jobs:
  stage:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WIKI_API: https://enthusia.miraheze.org/w/api.php
      WIKI_FULL_BACKUP_OUT: wiki-private-brand-player-output/full-backup
      WIKI_BOT_USERNAME: ${{ secrets.WIKI_BOT_USERNAME }}
      WIKI_BOT_PASSWORD: ${{ secrets.WIKI_BOT_PASSWORD }}
    steps:
      - name: Check out private stage source
        uses: actions/checkout@v4

      - name: Validate CSS-only private stage
        shell: bash
        run: |
          set -euo pipefail
          test -s wiki-worker/private-stage-brand-and-players-css-only.css
          python3 - <<'PY'
          from pathlib import Path
          css = Path('wiki-worker/private-stage-brand-and-players-css-only.css').read_text(encoding='utf-8')
          assert css.count('{') == css.count('}'), 'unbalanced CSS braces'
          assert 'Private staging pass 6.1' in css
          assert '#ff4b12' in css and '#ff8a00' in css and '#ffd36a' in css
          assert 'enthusia-logo-v2.png' in css
          assert 'page-Noteable_Players' in css
          assert 'flex-direction:column' in css
          print('CSS-only brand/player stage validation passed.')
          PY

      - name: Capture complete live wiki before private stage
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p wiki-private-brand-player-output
          python3 wiki-worker/full_backup.py | tee wiki-private-brand-player-output/full-backup.log
          test -s wiki-private-brand-player-output/full-backup/manifest.json
          pages="$(find wiki-private-brand-player-output/full-backup/pages -type f -name '*.wiki' | wc -l | tr -d ' ')"
          histories="$(find wiki-private-brand-player-output/full-backup/history -type f -name '*.json' | wc -l | tr -d ' ')"
          echo "full_backup_pages=$pages histories=$histories"
          test "$pages" -gt 0
          test "$histories" -eq "$pages"

      - name: Upload immutable pre-stage backup
        uses: actions/upload-artifact@v4
        with:
          name: enthusia-wiki-private-brand-player-backup-${{ github.run_id }}
          path: wiki-private-brand-player-output/
          if-no-files-found: error
          retention-days: 90

      - name: Publish P2wn-only CSS addition
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import http.cookiejar, json, os, time, urllib.parse, urllib.request
          from pathlib import Path

          API = os.environ['WIKI_API']
          USERNAME = os.environ['WIKI_BOT_USERNAME'].strip()
          PASSWORD = os.environ['WIKI_BOT_PASSWORD']
          TITLE = 'User:P2wn/common.css'
          BASE = 671
          MARKER = '/* Private staging pass 6.1: CSS-only real brand + deterministic player-card layout. */'
          COMMENT = 'Private CSS-only brand/player staging for Enthusia wiki redesign'
          BLOCK = Path('wiki-worker/private-stage-brand-and-players-css-only.css').read_text(encoding='utf-8').rstrip()
          OUT = Path('wiki-private-brand-player-output')

          jar = http.cookiejar.CookieJar()
          opener = urllib.request.build_opener(urllib.request.HTTPCookieProcessor(jar))
          def api(params, method='POST'):
              full={'format':'json','formatversion':'2','maxlag':'5',**params}
              headers={'User-Agent':'EnthusiaWikiPrivateBrandPlayerCssOnly/1.0','Accept':'application/json'}
              if method == 'GET':
                  req=urllib.request.Request(API+'?'+urllib.parse.urlencode(full),headers=headers)
              else:
                  headers['Content-Type']='application/x-www-form-urlencoded;charset=UTF-8'
                  req=urllib.request.Request(API,data=urllib.parse.urlencode(full).encode(),headers=headers)
              with opener.open(req,timeout=60) as response:
                  result=json.loads(response.read().decode())
              if result.get('error'): raise RuntimeError(result['error'])
              return result
          token=api({'action':'query','meta':'tokens','type':'login'},'GET')['query']['tokens']['logintoken']
          login=api({'action':'login','lgname':USERNAME,'lgpassword':PASSWORD,'lgtoken':token})
          if login.get('login',{}).get('result')!='Success': raise RuntimeError(login.get('login'))
          who=api({'action':'query','meta':'userinfo'},'GET')['query']['userinfo']
          if who.get('name')!='P2wn': raise RuntimeError(f"authenticated as {who.get('name')}")
          csrf=api({'action':'query','meta':'tokens'},'GET')['query']['tokens']['csrftoken']
          def read_page():
              result=api({'action':'query','prop':'revisions|info','titles':TITLE,'rvprop':'ids|timestamp|user|comment|content|contentmodel','rvslots':'main','curtimestamp':'1'},'GET')
              rev=result['query']['pages'][0]['revisions'][0]; slot=rev['slots']['main']
              return {'revid':rev['revid'],'timestamp':rev['timestamp'],'comment':rev.get('comment') or '','content':slot.get('content',''),'curtimestamp':result.get('curtimestamp')}
          before=read_page(); current=before['content'].rstrip()
          if MARKER in current:
              existing=current[current.index(MARKER):].rstrip()
              if existing != BLOCK: raise RuntimeError('live pass 6.1 block differs from approved source')
              print(f'PRIVATE CSS BRAND/PLAYER ALREADY CURRENT {TITLE} rev {before["revid"]}')
              report={'target':TITLE,'result':'already-current','beforeRevid':before['revid'],'afterRevid':before['revid']}
          else:
              if before['revid'] != BASE: raise RuntimeError(f'Expected {TITLE} rev {BASE}; found {before["revid"]}')
              desired=current+'\n\n'+BLOCK+'\n'
              edit=api({'action':'edit','title':TITLE,'text':desired,'token':csrf,'summary':COMMENT,'assert':'user','watchlist':'nochange','basetimestamp':before['timestamp'],'starttimestamp':before['curtimestamp']})
              e=edit.get('edit') or {}
              if e.get('result')!='Success': raise RuntimeError(f'edit failed: {e}')
              time.sleep(1); after=read_page()
              if after['content'].rstrip()!=desired.rstrip(): raise RuntimeError('exact readback failed')
              if after['comment']!=COMMENT: raise RuntimeError('edit-summary readback mismatch')
              print(f'PRIVATE CSS BRAND/PLAYER PUBLISHED {TITLE}: {before["revid"]} -> {after["revid"]}')
              report={'target':TITLE,'result':'published','beforeRevid':before['revid'],'afterRevid':after['revid']}
          OUT.mkdir(parents=True,exist_ok=True)
          (OUT/'private-brand-player-report.json').write_text(json.dumps([report],indent=2)+'\n',encoding='utf-8')
          PY

      - name: Upload private stage evidence
        uses: actions/upload-artifact@v4
        with:
          name: enthusia-wiki-private-brand-player-evidence-${{ github.run_id }}
          path: wiki-private-brand-player-output/
          if-no-files-found: warn
          retention-days: 90
