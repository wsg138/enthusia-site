name = "enthusia-site"
pages_build_output_dir = "dist/client"
compatibility_date = "2025-09-08"

[env.production.vars]
GUILDS_API_URL = "http://api.enthusia.info:2052/api/leaderboards/guilds?period=ALL_TIME&limit=10"
APP_ENV = "production"
STAFF_API_TARGET = "production"
COMPETITIONS_ENABLED = "true"
COMPETITIONS_PUBLIC_ACCESS = "true"
NETWORK_ACCOUNT_LINKS = "true"
COMPETITIONS_SITE_ORIGIN = "https://enthusia.info"
COMPETITIONS_MANAGER_ROLES = "founder,admin"
COMPETITIONS_MODERATOR_ROLES = "founder,admin,moderator,developer"
APPEAL_REVIEWER_ROLES = "founder,admin,moderator"
COMMUNITY_EDITOR_ROLES = "founder,admin"
DISCORD_CLIENT_ID = "1541144959510642778"
DISCORD_GUILD_ID = "1410303324745371709"
DISCORD_FOUNDER_ROLE_IDS = "1410305663535677671"
DISCORD_ADMIN_ROLE_IDS = "1413393301637300264"
DISCORD_DEVELOPER_ROLE_IDS = "1410306228243927071"
DISCORD_MODERATOR_ROLE_IDS = "1410326703741603870"
DISCORD_HELPER_ROLE_IDS = "1440500338380640277"
TURNSTILE_SITE_KEY = "0x4AAAAAAFU3UxAkWnulTmse"
DISCORD_OAUTH_REDIRECT_URI = "https://enthusia.info/api/competitions/auth/discord/callback"

[[env.production.d1_databases]]
binding = "COMPETITIONS_DB"
database_name = "enthusia-competitions"
database_id = "2544fed6-7aa3-4e42-b768-5b39c39ce4a5"
migrations_dir = "migrations"

[[env.production.d1_databases]]
binding = "COMMUNITY_DB"
database_name = "enthusia-community"
database_id = "1519be01-f6e5-4122-bdde-ef03fff5df27"
migrations_dir = "migrations/community"

[[env.production.r2_buckets]]
bucket_name = "enthusia-competitions-media"
binding = "COMPETITIONS_MEDIA"

[[env.production.r2_buckets]]
bucket_name = "balance-leaderboard"
binding = "BALANCE_LEADERBOARDS"

[[env.production.r2_buckets]]
bucket_name = "donator-leaderboard"
binding = "DONATOR_LEADERBOARDS"

[[env.production.r2_buckets]]
bucket_name = "playtime-leaderboard"
binding = "PLAYTIME_LEADERBOARDS"

[[env.production.r2_buckets]]
bucket_name = "events-leaderboard"
binding = "EVENTS_DATA"
