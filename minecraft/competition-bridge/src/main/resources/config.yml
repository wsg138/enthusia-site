# Enthusia Competition Bridge
# Keep the listener on loopback and expose it only through a protected HTTPS reverse proxy / Cloudflare Tunnel.
server:
  enabled: false
  bind-host: "127.0.0.1"
  allow-non-loopback-bind: false
  port: 8765
  worker-threads: 4
  max-request-bytes: 65536
  main-thread-timeout-ms: 4000

security:
  # Prefer environment variables ENTHUSIA_COMPETITION_BRIDGE_BEARER_TOKEN and
  # ENTHUSIA_COMPETITION_BRIDGE_HMAC_SECRET. When server.enabled=true, both must
  # be different random values of at least 32 characters.
  bearer-token: ""
  hmac-secret: ""
  max-clock-skew-seconds: 90
  nonce-retention-seconds: 300

integrations:
  playtime-plugin: "EnthusiaPlaytime"
  guilds-plugin: "LumaGuilds"
  lore-items-plugin: "EnthusiaLoreItems"
  # Public website key returned in player-context when LumaGuilds grants the enum permission below.
  website-guild-submit-permission: "competition.submit"
  lumaguilds-submit-permission: "SUBMIT_COMPETITION_ENTRIES"

staff:
  review-permission: "enthusia.competitions.review"

notifications:
  contributor-login-reminders: true
  staff-prefix: "&6[Competitions]&r "
  contributor-prefix: "&d[Competition Invite]&r "

rewards:
  items:
    # Queued vanilla items retry while a recipient is online and also on login.
    retry-seconds: 60
  # Raw command rewards are powerful and therefore opt-in + prefix restricted.
  commands:
    enabled: false
    allowed-prefixes:
      - "give "
      - "minecraft:give "
  permissions:
    permanent-command: "lp user {player} permission set {permission} true"
    temporary-command: "lp user {player} permission settemp {permission} true {durationSeconds}s"
  ranks:
    permanent-command: "lp user {player} parent add {rank}"
    temporary-command: "lp user {player} parent addtemp {rank} {durationSeconds}s"
  lore-items:
    # Reserved for an explicit emergency fallback. Current bridge delivery uses
    # the stable EnthusiaLoreItems V1 Bukkit service and otherwise fails closed.
    fallback-command: ""

logging:
  log-successful-requests: false
  log-rejected-requests: true
